[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # These values select runtime modes; they are configuration, not credentials.
  SECRETS_SCAN_OMIT_KEYS = "SONITUS_DATA_MODE,COINGECKO_API_MODE"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
