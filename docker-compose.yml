services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonitus
      POSTGRES_PASSWORD: sonitus
      POSTGRES_DB: sonitus
    ports:
      - "5432:5432"
    volumes:
      - sonitus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonitus -d sonitus"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - sonitus-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sonitus-postgres:
  sonitus-redis:
