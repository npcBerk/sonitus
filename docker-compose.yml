services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonitus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonitus-local-only}
      POSTGRES_DB: sonitus
    ports:
      - "5432:5432"
    volumes:
      - sonitus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonitus -d sonitus"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sonitus-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://sonitus:${POSTGRES_PASSWORD:-sonitus-local-only}@postgres:5432/sonitus?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
      SONITUS_DATA_MODE: database
      DATABASE_URL: postgresql://sonitus:${POSTGRES_PASSWORD:-sonitus-local-only}@postgres:5432/sonitus?schema=public
      REDIS_URL: redis://redis:6379
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:?Set INTERNAL_JOB_TOKEN to at least 32 characters}
      SCAN_STALE_MINUTES: ${SCAN_STALE_MINUTES:-15}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: production
      SONITUS_DATA_MODE: database
      DATABASE_URL: postgresql://sonitus:${POSTGRES_PASSWORD:-sonitus-local-only}@postgres:5432/sonitus?schema=public
      REDIS_URL: redis://redis:6379
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-5}
      SCAN_LOCK_SECONDS: ${SCAN_LOCK_SECONDS:-1200}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-30}
      VOLUME_BASELINE_TOLERANCE_MINUTES: ${VOLUME_BASELINE_TOLERANCE_MINUTES:-90}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
      CATEGORY_CACHE_TTL_SECONDS: ${CATEGORY_CACHE_TTL_SECONDS:-604800}
      COINGECKO_API_MODE: ${COINGECKO_API_MODE:-public}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-}
      COINGECKO_SCAN_LIMIT: ${COINGECKO_SCAN_LIMIT:-25}
      COINGECKO_CONCURRENCY: ${COINGECKO_CONCURRENCY:-4}
      COINGECKO_TIMEOUT_MS: ${COINGECKO_TIMEOUT_MS:-10000}
      COINGECKO_MAX_RETRIES: ${COINGECKO_MAX_RETRIES:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sonitus-postgres:
  sonitus-redis:
